<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>wisp</title>
<style>
:root{--bg:#000;--fg:#ddd;--dim:#777;--ac:#b266ff;--bd:#333;--selBg:#b266ff;--selFg:#000;--err:#f55;--font:monospace;--fs:14px;--bs:solid}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:var(--fs)/1.4 var(--font);display:flex;flex-direction:column;gap:14px;padding:12px 14px;overflow:hidden}
.box{border:1px var(--bs) var(--bd);position:relative;padding:12px 14px}
.bt{position:absolute;top:-.75em;left:1.5ch;background:var(--bg);padding:0 1ch;color:var(--ac)}
input,button,select{font:inherit;color:inherit;outline:0;border-radius:0}
button{background:none;border:0;cursor:pointer;padding:0 .5ch}button:hover,button:focus-visible{background:var(--ac);color:var(--bg)}
header{display:flex;gap:3ch;align-items:center;flex:none}
#logo{color:var(--ac);white-space:pre;line-height:1.05;font-size:.9em}
.sbox{flex:1;display:flex;gap:1ch;align-items:center}.sbox span{color:var(--ac)}
#q{flex:1;background:none;border:0;caret-color:var(--ac);caret-shape:block;min-width:0}#q::placeholder{color:var(--dim)}
nav{display:flex;flex-wrap:wrap;gap:0 3ch;flex:none;color:var(--dim)}nav div{display:flex;gap:1ch;flex-wrap:wrap}
nav button{color:var(--dim)}nav .on{background:var(--ac);color:var(--bg)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
#list{flex:1;overflow:auto;margin:0 -6px;scrollbar-width:thin;scrollbar-color:var(--ac) transparent}
.row{display:grid;grid-template-columns:2ch 3ch 1fr minmax(8ch,24ch) 6ch;gap:1.5ch;padding:1px 6px;cursor:pointer;white-space:nowrap}
.row b,.row span{overflow:hidden;text-overflow:ellipsis;font-weight:400}.row span,.row em{color:var(--dim);font-style:normal}.row i{font-style:normal;color:var(--dim)}.row em{text-align:right}
.row.now b{color:var(--ac)}.row.sel{background:var(--selBg);color:var(--selFg)}.row.sel *{color:var(--selFg)!important}
.row img{width:1.3em;height:1.3em;vertical-align:-.25em;margin-right:1ch;image-rendering:pixelated}
.m{padding:4px 6px;color:var(--dim)}.m.e{color:var(--err)}
footer{flex:none;display:flex;flex-direction:column;gap:6px}
.pl{display:flex;gap:2ch;align-items:center;flex-wrap:wrap}#np{flex:1;min-width:20ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#np b{color:var(--ac);font-weight:400}
#seek,#vol{cursor:pointer;white-space:pre;color:var(--ac)}#vol{color:var(--dim)}
#st{display:flex;justify-content:space-between;gap:2ch;color:var(--dim);font-size:.9em;white-space:nowrap;overflow:hidden}#msg{color:var(--ac)}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
#menu,#help{display:none;position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--bg);z-index:5;min-width:min(60ch,92vw)}#help{bottom:auto;top:20%}
#menu.open,#help.open{display:block}#menu div{padding:2px 4px;cursor:pointer}#menu div:hover{background:var(--ac);color:var(--bg)}#menu u{text-decoration:none;color:var(--dim)}#menu div:hover u{color:var(--bg)}
#help p{display:flex;justify-content:space-between;gap:4ch}#help p b{color:var(--ac);font-weight:400}
dialog{margin:auto;background:var(--bg);color:var(--fg);border:1px var(--bs) var(--ac);padding:16px 20px;width:min(54ch,94vw)}dialog::backdrop{background:rgba(0,0,0,.8)}
dialog .bt{background:var(--bg)}dialog label,dialog .f{display:block;margin:10px 0;color:var(--dim)}dialog input[type=radio]{accent-color:var(--ac)}
dialog select,dialog input[type=text]{display:block;width:100%;margin-top:4px;background:var(--bg);border:1px var(--bs) var(--bd);padding:3px 6px}
.acts{display:flex;justify-content:flex-end;gap:2ch;margin-top:14px}.off{opacity:.35;pointer-events:none}
.row{animation:in .18s steps(4) both;animation-delay:calc(var(--i)*14ms)}@keyframes in{from{opacity:0;transform:translateX(-6px)}}
body.noanim *{animation:none!important}body.scan::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:700px){.row{grid-template-columns:2ch 3ch 1fr 6ch}.row span{display:none}#logo{display:none}}
</style><style id="custom"></style></head><body>
<header><pre id="logo"></pre><div class="box sbox"><span class="bt">search</span><span>❯</span><input id="q" placeholder="artists, tracks, playlists…" autofocus><button id="gear" title="settings">[s]</button></div></header>
<nav><div id="genres"></div><div id="types"><button data-t="tracks" class="on">tracks</button><button data-t="users">artists</button><button data-t="playlists">playlists</button></div></nav>
<main class="box"><span class="bt" id="title"></span><div id="list"></div></main>
<footer class="box"><span class="bt">now playing</span>
<div class="pl"><span id="np"><b>—</b></span><span><button id="prev">[⏮]</button><button id="pp">[▶]</button><button id="next">[⏭]</button></span>
<span><span id="cur">00:00</span> <span id="seek"></span> <span id="dur">00:00</span></span><span id="vol"></span>
<span><button id="lk">[c]opy link</button><button id="dl">[d]ownload</button></span></div>
<div id="st"><span id="msg"></span><span id="hint"></span></div></footer>
<div id="menu" class="box"></div><div id="help" class="box"></div>
<dialog id="dlg"><span class="bt">settings</span>
<div class="f">theme<select id="thm"></select></div>
<label><input type="radio" name="mode" value="direct"> direct (soundcloud.com)</label>
<label><input type="radio" name="mode" value="instance"> soundcloak instance</label>
<div class="f" id="ifield">instance<select id="ipre"></select><input type="text" id="inst" placeholder="https://your-instance.example" style="display:none"></div>
<div class="acts"><button id="cancel">[cancel]</button><button id="save">[save]</button></div></dialog>
<script>
const $=s=>document.querySelector(s),a=new Audio();
let UI,TH,CFG={},list=[],queue=[],cur=-1,sel=0,type='tracks',genre='all-music',nowId=null,hist=[],view=null,menuItems=[],msgT;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=ms=>{if(!isFinite(ms)||!ms)return'';const s=Math.round(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const say=t=>{$('#msg').textContent=t;clearTimeout(msgT);msgT=setTimeout(()=>$('#msg').textContent='',3500)};
const post=async p=>{CFG={...CFG,...p};await fetch('/api/settings',{method:'POST',body:JSON.stringify(CFG)})};
function applyTheme(n){const t=TH.find(x=>x.name==n)||TH[0],s=document.documentElement.style;
 Object.entries({bg:t.bg,fg:t.fg,dim:t.dim,ac:t.accent,bd:t.border,selBg:t.selBg,selFg:t.selFg,err:t.error}).forEach(([k,v])=>s.setProperty('--'+k,v));CFG.theme=t.name}
async function init(){const u=await(await fetch('/api/ui')).json();UI=u.ui;TH=u.themes;CFG=await(await fetch('/api/settings')).json();
 const s=document.documentElement.style;s.setProperty('--font',UI.font);s.setProperty('--fs',UI.fontSize+'px');s.setProperty('--bs',UI.borderStyle);
 applyTheme(CFG.theme||UI.defaultTheme);document.title=UI.title;$('#custom').textContent=UI.customCss||'';
 $('#logo').textContent=UI.logo||UI.title;document.body.classList.toggle('scan',UI.scanlines);document.body.classList.toggle('noanim',!UI.animations);
 $('#genres').innerHTML=UI.genres.map((g,i)=>`<button data-g="${esc(g.id)}"${i?'':' class="on"'}>${esc(g.label)}</button>`).join('');genre=UI.genres[0]?.id||'all-music';
 chips('#types',b=>{type=b.dataset.t;search()});chips('#genres',b=>{genre=b.dataset.g;$('#q').value='';show('/api/trending?genre='+genre,'trending · '+b.textContent)});
 const k=UI.keys;$('#hint').innerHTML=`${k.down}/${k.up} move · ${k.select} open · ${k.back} back · ${k.search} search · ${k.copy} copy · ${k.download} dl · ${k.help} help`+(UI.animations?' <span class=blink>█</span>':'');
 $('#help').innerHTML='<span class=bt>keys</span>'+Object.entries(k).map(([n,v])=>`<p><span>${n}</span><b>${esc(v==' '?'Space':v)}</b></p>`).join('');
 draw();home()}
const chips=(sel,fn)=>document.querySelectorAll(sel+' button').forEach(b=>b.onclick=()=>{document.querySelector(sel+' .on')?.classList.remove('on');b.classList.add('on');fn(b)});
async function show(u,t,push=true){if(push&&view)hist.push(view);view={u,t};$('#title').textContent=t;$('#list').innerHTML='<p class="m blink">loading…</p>';
 try{const r=await fetch(u);if(!r.ok)throw new Error(await r.text());list=await r.json();sel=0;render()}catch(e){list=[];$('#list').innerHTML='<p class="m e">error: '+esc(e.message)+'</p>'}}
function render(){$('#list').innerHTML=list.map((it,i)=>{const k=it.kind=='user'?'@ ':it.kind=='playlist'?'≡ ':'',pl=it.id==nowId;
 return`<div class="row${i==sel?' sel':''}${pl?' now':''}" data-i="${i}" style="--i:${Math.min(i,24)}"><i>${i==sel?esc(UI.prompt):''}</i><i>${pl?esc(UI.nowPlaying):String(i+1).padStart(2,'0')}</i><b>${UI.showArt&&it.art?`<img src="${esc(it.art)}" loading=lazy onerror="this.remove()">`:''}${k}${esc(it.title)}</b><span>${esc(it.sub)}</span><em>${fmt(it.dur)}</em></div>`}).join('')||'<p class="m">nothing found</p>'}
function move(d){if(!list.length)return;sel=Math.max(0,Math.min(list.length-1,sel+d));render();document.querySelector('.row.sel')?.scrollIntoView({block:'nearest'})}
function activate(i){const it=list[i];if(!it)return;sel=i;
 if(it.kind=='user')show('/api/user?id='+encodeURIComponent(it.id),'@ '+it.title);
 else if(it.kind=='playlist')show('/api/playlist?id='+encodeURIComponent(it.id),'≡ '+it.title);
 else{queue=list.filter(x=>x.kind=='track');play(queue.indexOf(it))}}
$('#list').onclick=e=>{const r=e.target.closest('.row');if(r)activate(+r.dataset.i)};
function play(i){if(i<0||i>=queue.length)return;cur=i;const t=queue[i];nowId=t.id;a.src=t.stream;a.play().catch(()=>{});
 $('#np').innerHTML=`<b>${esc(UI.nowPlaying)}</b> ${esc(t.title)} <span style="color:var(--dim)">— ${esc(t.sub)}</span>`;$('#dur').textContent=fmt(t.dur)||'00:00';render();
 if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.sub})}
const toggle=()=>a.paused?a.play():a.pause();
$('#pp').onclick=toggle;$('#next').onclick=()=>play(cur+1);$('#prev').onclick=()=>{a.currentTime>3?a.currentTime=0:play(cur-1)};
a.onplay=()=>$('#pp').textContent='[⏸]';a.onpause=()=>$('#pp').textContent='[▶]';a.onended=()=>play(cur+1);
a.onerror=()=>{if(cur>=0)say('could not play this track')};a.volume=.8;
const D=()=>isFinite(a.duration)?a.duration:(queue[cur]?.dur||0)/1000;
const bar=(v,w)=>{const f=Math.max(0,Math.min(w,Math.round(v*w)));return UI.barFull.repeat(f)+UI.barEmpty.repeat(w-f)};
function draw(){const d=D();$('#seek').textContent='['+bar(d?a.currentTime/d:0,UI.barWidth)+']';$('#vol').textContent='vol ['+bar(a.volume,10)+']';$('#cur').textContent=fmt(a.currentTime*1000)||'00:00';if(d)$('#dur').textContent=fmt(d*1000)}
a.ontimeupdate=draw;a.onvolumechange=draw;
$('#seek').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();if(D())a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*D()};
$('#vol').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();a.volume=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))};
function search(){const q=$('#q').value.trim();if(q)show(`/api/search?type=${type}&q=${encodeURIComponent(q)}`,`${type} · ${q}`)}
function home(){hist=[];view=null;show('/api/trending?genre='+genre,'trending')}
function back(){if(hist.length){const v=hist.pop();show(v.u,v.t,false)}}
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){search();e.target.blur()}if(e.key==='Escape')e.target.blur()});
// copy link + download
function openMenu(){const t=queue[cur];if(!t||!t.path){say('nothing playing');return}
 menuItems=UI.copyTargets.map(c=>({label:c.label,url:c.base.replace('{instance}',(CFG.instance||'').replace(/\/$/,''))+t.path}));
 $('#menu').innerHTML='<span class=bt>copy link</span>'+menuItems.map((m,i)=>`<div data-i="${i}">[${i+1}] Copy (${esc(m.label)}) <u>${esc(m.url.replace(/^https?:\/\//,''))}</u></div>`).join('');$('#menu').classList.add('open')}
const closeMenu=()=>$('#menu').classList.remove('open');
async function pick(i){const m=menuItems[i];if(!m)return;closeMenu();
 try{await navigator.clipboard.writeText(m.url)}catch(e){const x=document.createElement('textarea');x.value=m.url;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}say('copied '+m.url)}
$('#menu').onclick=e=>{const d=e.target.closest('[data-i]');if(d)pick(+d.dataset.i)};
document.addEventListener('click',e=>{if(!e.target.closest('#menu,#lk'))closeMenu()});
function download(){const t=queue[cur];if(!t){say('nothing playing');return}const n=(t.sub?t.sub+' - ':'')+t.title,l=document.createElement('a');
 l.href=t.stream+(t.stream.includes('?')?'&':'?')+'dl='+encodeURIComponent(n);document.body.appendChild(l);l.click();l.remove();say('downloading '+n)}
$('#lk').onclick=openMenu;$('#dl').onclick=download;
// settings
const mode=()=>document.querySelector('input[name=mode]:checked').value,pre=$('#ipre');
function sync(){$('#ifield').classList.toggle('off',mode()=='direct');$('#inst').style.display=pre.value?'none':'block'}
document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=sync);pre.onchange=sync;$('#thm').onchange=e=>applyTheme(e.target.value);
async function settings(){CFG={...CFG,...await(await fetch('/api/settings')).json(),theme:CFG.theme};let L=[];try{L=await(await fetch('/api/instances')).json()}catch(e){}
 const o=(u,t)=>`<option value="${esc(u)}">${esc(u.replace('https://',''))} · ${t}</option>`,extra=['https://ss.2kool4u.net'].filter(u=>!L.some(i=>i.url==u));
 $('#thm').innerHTML=TH.map(t=>`<option${t.name==CFG.theme?' selected':''}>${esc(t.name)}</option>`).join('');
 pre.innerHTML=L.filter(i=>i.api).map(i=>o(i.url,'api')).join('')+L.filter(i=>!i.api).map(i=>o(i.url,'html')).join('')+extra.map(u=>o(u,'html')).join('')+'<option value="">custom…</option>';
 document.querySelector(`input[value=${CFG.mode}]`).checked=true;
 if([...pre.options].some(x=>x.value&&x.value==CFG.instance))pre.value=CFG.instance;else{pre.value='';$('#inst').value=CFG.instance}
 sync();$('#dlg').showModal()}
$('#gear').onclick=settings;$('#cancel').onclick=()=>{applyTheme(CFG.theme);$('#dlg').close()};
$('#save').onclick=async()=>{await post({theme:$('#thm').value,mode:mode(),instance:pre.value||$('#inst').value.trim()});$('#dlg').close();$('#q').value.trim()?search():home()};
// keyboard
const act={down:()=>move(1),up:()=>move(-1),select:()=>activate(sel),back,home,search:()=>$('#q').focus(),playPause:toggle,next:()=>play(cur+1),prev:()=>play(cur-1),
 seekFwd:()=>a.currentTime+=10,seekBack:()=>a.currentTime-=10,volUp:()=>a.volume=Math.min(1,a.volume+.05),volDown:()=>a.volume=Math.max(0,a.volume-.05),
 copy:openMenu,download,settings,help:()=>$('#help').classList.toggle('open'),
 theme:()=>{const n=TH[(TH.findIndex(t=>t.name==CFG.theme)+1)%TH.length].name;applyTheme(n);post({theme:n});say('theme: '+n)},
 tab:()=>{const b=[...document.querySelectorAll('#types button')],i=(b.findIndex(x=>x.classList.contains('on'))+1)%b.length;b[i].click()}};
document.addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg=='INPUT'||tg=='SELECT'||$('#dlg').open)return;
 if($('#menu').classList.contains('open')){e.preventDefault();if(/^[1-9]$/.test(e.key))pick(+e.key-1);else if(e.key=='Escape')closeMenu();return}
 if(e.key=='Escape'){$('#help').classList.remove('open');return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const n=Object.keys(UI.keys).find(k=>UI.keys[k]===e.key)||{ArrowDown:'down',ArrowUp:'up'}[e.key];
 if(n&&act[n]){e.preventDefault();if(e.target.tagName=='BUTTON')e.target.blur();act[n]()}});
init();
</script></body></html>
